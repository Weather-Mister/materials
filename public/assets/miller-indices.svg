<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Miller planes: course indexing rule</title><rect width="960" height="540" rx="24" fill="#f8fbfe"/><rect x="26" y="26" width="908" height="488" rx="18" fill="#fff" stroke="#d8e2ec" stroke-width="2"/><text x="54" y="68" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24354b">Miller planes: course indexing rule</text><text x="54" y="92" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#718096">SOURCE-GROUNDED COURSE SCHEMATIC</text>
<g transform="translate(95,150)" stroke="#8fa3b7" stroke-width="3" fill="none"><rect width="220" height="220"/><path d="M0 0l55-55h220v220l-55 55M220 0l55-55M220 220l55-55M0 220l55-55"/></g><polygon points="150,150 315,260 315,370 150,260" fill="#eef4ff" stroke="#4f7cff" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#34465a"><text x="430" y="160" font-size="18" font-weight="700">Plane procedure</text><text x="430" y="200" font-size="16">1  Find x, y, z intercepts</text><text x="430" y="238" font-size="16">2  Take reciprocals</text><text x="430" y="276" font-size="16">3  Clear fractions</text><text x="430" y="314" font-size="16" font-weight="700" fill="#a9602f">4  Do NOT reduce afterward</text><text x="430" y="352" font-size="16">5  Write the plane as (hkl)</text></g><rect x="430" y="382" width="405" height="62" rx="12" fill="#f1f6fd" stroke="#d9e6f5"/><text x="450" y="408" font-family="Arial,sans-serif" font-size="14" fill="#334a66">Plane through origin? Shift to an equivalent lattice point first.</text><text x="450" y="431" font-family="Arial,sans-serif" font-size="13" fill="#607389">Families: {hkl} · directions: [uvw], ⟨uvw⟩</text></svg>