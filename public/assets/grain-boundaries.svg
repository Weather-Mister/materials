<text class="h" x="70" y="65">Grain boundaries interrupt dislocation motion</text><g transform="translate(75 110)"><polygon class="g1" points="0,0 220,20 260,185 95,310 0,250"/><polygon class="g2" points="220,20 470,0 520,200 390,330 260,185"/><polygon class="g3" points="470,0 760,40 790,290 590,330 520,200"/><polygon class="g1" points="95,310 260,185 390,330 330,390 90,390"/><polygon class="g2" points="390,330 520,200 590,330 530,390 330,390"/><line class="d" x1="70" y1="165" x2="235" y2="180"/><line class="d" x1="325" y1="115" x2="485" y2="180"/><text class="code" x="110" y="150">dislocation</text><text class="code" x="270" y="365">boundary = obstacle</text></g><text class="s" x="845" y="180">Smaller grains</text><text class="s" x="845" y="220">→ more boundaries</text><text class="s" x="845" y="260">→ shorter travel</text><text class="s" x="845" y="300">→ higher strength</text><text class="code" x="845" y="365">σᵧ = σ₀ + Kd⁻¹ᐟ²</text></svg>