<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>Schmid's law: resolved shear stress</title><rect width="960" height="540" rx="24" fill="#f8fbfe"/><rect x="26" y="26" width="908" height="488" rx="18" fill="#fff" stroke="#d8e2ec" stroke-width="2"/><text x="54" y="68" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24354b">Schmid's law: resolved shear stress</text><text x="54" y="92" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#718096">SOURCE-GROUNDED COURSE SCHEMATIC</text>
