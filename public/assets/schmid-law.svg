<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e4e3f"/></marker><style>.bg{fill:#fbf7ef}.rod{fill:#e8ddcd;stroke:#6d7880;stroke-width:5}.plane{fill:#8db4b8;fill-opacity:.55;stroke:#3f6f75;stroke-width:4}.f{stroke:#8e4e3f;stroke-width:8;marker-end:url(#ar)}.n{stroke:#3f6f75;stroke-width:6;marker-end:url(#ar)}.dash{stroke:#7d888f;stroke-width:3;stroke-dasharray:8 7}.h{font:700 31px system-ui;fill:#25313a}.s{font:500 22px system-ui;fill:#64717a}.code{font:800 26px ui-monospace,monospace;fill:#8e4e3f}</style></defs><rect class="bg" width="1000" height="620" rx="28"/>
<g transform="translate(120 55)"><ellipse class="rod" cx="250" cy="80" rx="120" ry="35"/><path class="rod" d="M130 80v360c0 20 54 35 120 35s120-15 120-35V80"/><ellipse class="rod" cx="250" cy="440" rx="120" ry="35"/><polygon class="plane" points="140,265 230,205 365,245 280,310"/><line class="f" x1="250" y1="65" x2="250" y2="-25"/><line class="f" x1="250" y1="455" x2="250" y2="545"/><text class="code" x="285" y="10">σ</text><line class="n" x1="260" y1="255" x2="365" y2="165"/><text class="code" x="370" y="160">plane normal</text><line class="f" x1="205" y1="285" x2="340" y2="235"/><text class="code" x="345" y="235">slip direction</text><line class="dash" x1="250" y1="255" x2="250" y2="120"/><text class="s" x="285" y="145">φ</text><text class="s" x="250" y="335">λ</text></g>
<g transform="translate(600 150)"><text class="h" x="0" y="0">Resolved shear stress</text><text class="code" x="0" y="70">τᵣ = σ cosφ cosλ</text><text class="s" x="0" y="130">Slip begins when</text><text class="code" x="0" y="175">τᵣ = τCRSS</text><text class="s" x="0" y="245">φ: load axis ↔ plane normal</text><text class="s" x="0" y="285">λ: load axis ↔ slip direction</text></g></svg>